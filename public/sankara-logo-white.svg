    <!-- Sacred White Silhouette of Sri Adi Shankaracharya & Disciples -->
    <g id="sacred-silhouette">
      <!-- Base / Ground Pedestal Arc -->
      <path d="M 254,242 Q 330,258 406,242 C 386,253 358,258 330,258 C 302,258 274,253 254,242 Z" fill="#FFFFFF" />

      <!-- Staff (Danda) -->
      <path d="M 268,114 L 272,114 L 271,246 L 267,246 Z" fill="#FFFFFF" />
      <circle cx="270" cy="112" r="4" fill="#FFFFFF" />
      <!-- Sacred Kashaya cloth banner at top of staff -->
