      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;display=swap');
      .sankara-brand-name {
        font-family: 'Montserrat', 'Liberation Sans', 'Arial Black', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 900;
        letter-spacing: -0.01em;
      }
